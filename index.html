<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center py-3">
            <h2>🎓 Student Management</h2>
            <button id="addStudentBtn" class="btn btn-primary">Add Student</button>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" id="searchStudent" class="form-control" placeholder="Search Student...">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Sr.No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Contact</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>


        <div class="d-none custom-modal" id="studentModal">
            <div class="custom-modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="modalTitle">Add Student</h4>
                        <button type="button" class="close" id="closeModalBtn">&times;</button>
                    </div>


                    <div class="modal-body">
                        <form id="studentForm">
                            <div class="form-group">
                                <label for="fname">First Name</label>
                                <input type="text" id="fname" class="form-control" placeholder="Enter first name"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="lname">Last Name</label>
                                <input type="text" id="lname" class="form-control" placeholder="Enter last name"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                            </div>

                            <div class="form-group">
                                <label for="contact">Contact</label>
                                <input type="number" id="contact" class="form-control" placeholder="Enter contact"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="course">Course</label>
                                <select id="course" class="form-control" required>
                                    <option value="">Select Course</option>
                                    <option value="JavaScript">JavaScript</option>
                                    <option value="Angular">Angular</option>
                                    <option value="React">React</option>
                                    <option value="Java">Java</option>
                                </select>
                            </div>

                            <button type="submit" id="addBtn" class="btn btn-primary">Add Student</button>
                            <button type="button" id="updateBtn" class="btn btn-success d-none">Update Student</button>
                            <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./assets/js/app.js"></script>
</body>

</html>
